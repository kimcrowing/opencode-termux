name: v2 from-source

# Builds OpenCode v2 (`opencode2`) for Android aarch64.
#
# Design constraints this workflow is built around:
#   * GitHub's free runners are 4 vCPU / ~16 GB. A monolithic build blows that
#     budget, so every expensive stage is its own job with its own cache.
#   * Each job restores only the artifacts it needs and uploads only what the
#     next job consumes, so a failure in a late stage does not force a rebuild
#     of an early one.
#   * Cache keys are content-hashed, so re-running after a no-op change is
#     nearly free, and editing one script only invalidates that stage.
#
# Stages:
#   1. build-libopentui  -> libopentui.so (Zig + NDK, the memory-heavy step)
#   2. build-web-assets  -> embedded web UI archive (Vite; cached by upstream SHA)
#   3. build-opencode2   -> opencode2 binary (Bun bundle for android)
#   4. package           -> shippable archive

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to build (branch, tag, or SHA)"
        required: false
        default: "beta"
        type: string
      skip_web_ui:
        description: "Skip building the embedded web UI (faster, TUI-only binary)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single source of truth for tool versions. Keep in sync with scripts/env.sh.
  BUN_VERSION: "1.4.1"
  ZIG_VERSION: "0.16.0"
  OPENTUI_VERSION: "v0.5.10"
  ANDROID_API: "24"
  ANDROID_NDK_VERSION: "r28c"
  # Zig's own parallelism. The native link is the memory peak of the whole
  # build; keeping this low is what stops the runner from OOM-killing.
  ZIG_JOBS: "2"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: libopentui.so
  #
  # The heaviest native step and the one most likely to break when opentui
  # changes, so it is isolated. Produces the OTUI_ASSET_ROOT tree that lets
  # @opentui/core load a native library on a platform it has no prebuild for.
  # ---------------------------------------------------------------------------
  build-libopentui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache libopentui.so
        # The expensive output. Keyed on everything that affects it: the tag,
        # the patch contents, the toolchain versions and the API level.
        id: cache-so
        uses: actions/cache@v5
        with:
          path: build/otui-assets
          key: libopentui-${{ env.OPENTUI_VERSION }}-zig${{ env.ZIG_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-api${{ env.ANDROID_API }}-${{ hashFiles('patches/opentui/*.patch', 'scripts/build-opentui.sh') }}

      - name: Cache Zig toolchain
        if: steps.cache-so.outputs.cache-hit != 'true'
        id: cache-zig
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}

      - name: Install Zig
        # Zig 0.16 renamed its tarballs to zig-<arch>-<os>-<version>.tar.xz
        # (0.15 and earlier used zig-<os>-<arch>-<version>).
        if: steps.cache-so.outputs.cache-hit != 'true' && steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/zig
          cd ~/.cache/zig
          curl -fsSL --max-time 600 -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -xf zig.tar.xz
          rm zig.tar.xz
          # The tarball root is zig-x86_64-linux-<version>/; normalise to zig/
          mv zig-x86_64-linux-${ZIG_VERSION} zig
          ~/.cache/zig/zig/zig version

      - name: Cache Android NDK
        if: steps.cache-so.outputs.cache-hit != 'true'
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: /opt/android-ndk
          key: ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android NDK
        if: steps.cache-so.outputs.cache-hit != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL --max-time 900 -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          rm ndk.zip
          sudo mkdir -p /opt/android-ndk
          sudo cp -a android-ndk-${ANDROID_NDK_VERSION}/. /opt/android-ndk/
          sudo chmod -R +rX /opt/android-ndk
          /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++ --version

      - name: Cache opentui + yoga sources
        if: steps.cache-so.outputs.cache-hit != 'true'
        # Sources are large and slow to clone. Keyed by version so bumping
        # OPENTUI_VERSION naturally invalidates them. zig-deps/ (the vendored
        # yoga/ghostty/uucode materialized by prepare-zig-deps.sh) lives inside
        # build/opentui-src and is restored with it. The patch hash is included
        # because a cached tree carries the old patch already applied, and the
        # build script's forward/reverse apply check cannot recover from that.
        uses: actions/cache@v5
        with:
          path: |
            build/opentui-src
          key: otui-src-${{ env.OPENTUI_VERSION }}-p${{ hashFiles('patches/opentui/*.patch', 'scripts/build-opentui.sh') }}

      - name: Build libopentui.so
        if: steps.cache-so.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: /opt/android-ndk
          OPENTUI_VERSION: ${{ env.OPENTUI_VERSION }}
          ZIG_JOBS: ${{ env.ZIG_JOBS }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cache/zig/zig:$PATH"
          chmod +x scripts/build-opentui.sh
          ./scripts/build-opentui.sh

      - name: Verify libopentui.so
        env:
          ANDROID_NDK_HOME: /opt/android-ndk
        run: |
          set -euo pipefail
          SO="build/otui-assets/@opentui/core-linux-arm64/libopentui.so"
          test -f "$SO" || { echo "::error::libopentui.so missing at $SO"; exit 1; }
          echo "== file =="
          file "$SO"
          echo "== NEEDED =="
          readelf -d "$SO" | grep NEEDED || echo "(none)"
          readelf -d "$SO" | grep -q "NEEDED.*libc.so" \
            || { echo "::error::libopentui.so has no NEEDED libc.so"; exit 1; }
          # Must be an aarch64 shared object, not a host build.
          readelf -h "$SO" | grep -q "AArch64" \
            || { echo "::error::libopentui.so is not AArch64"; exit 1; }
          echo "::notice::libopentui.so OK ($(du -h "$SO" | cut -f1))"

      - name: Upload libopentui.so
        uses: actions/upload-artifact@v5
        with:
          name: libopentui-android
          path: build/otui-assets
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 2: Android compat libraries
  #
  # Two tiny C files, seconds to build, independent of the OpenCode version.
  # Split out so their cache key stays stable across upstream bumps.
  # ---------------------------------------------------------------------------
  build-compat-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache compat libs
        id: cache-compat
        uses: actions/cache@v5
        with:
          path: build/compat
          key: compat-${{ env.ANDROID_NDK_VERSION }}-api${{ env.ANDROID_API }}-${{ hashFiles('src/*.c', 'scripts/build-compat-libs.sh') }}

      - name: Cache Android NDK
        if: steps.cache-compat.outputs.cache-hit != 'true'
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: /opt/android-ndk
          key: ndk-${{ runner.os }}-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android NDK
        if: steps.cache-compat.outputs.cache-hit != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL --max-time 900 -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          rm ndk.zip
          sudo mkdir -p /opt/android-ndk
          sudo cp -a android-ndk-${ANDROID_NDK_VERSION}/. /opt/android-ndk/
          sudo chmod -R +rX /opt/android-ndk

      - name: Build compat libraries
        if: steps.cache-compat.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: /opt/android-ndk
        run: |
          set -euo pipefail
          chmod +x scripts/build-compat-libs.sh
          ./scripts/build-compat-libs.sh

      - name: Upload compat libraries
        uses: actions/upload-artifact@v5
        with:
          name: compat-libs-android
          path: build/compat
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 2: web UI assets (Vite build of packages/app)
  #
  # The embedded web archive is produced by a Vite build - the second biggest
  # memory consumer after the Zig/NDK build. It is cached by upstream SHA so a
  # same-commit re-dispatch skips Vite entirely, and the opencode2 bundle job
  # reuses this artifact instead of re-running Vite itself.
  # ---------------------------------------------------------------------------
  build-web-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve upstream ref
        id: ref
        run: echo "ref=${{ inputs.upstream_ref }}" >> "$GITHUB_OUTPUT"

      - name: Cache upstream source
        id: cache-upstream
        uses: actions/cache@v5
        with:
          path: build/opencode-src
          key: opencode-src-web-${{ steps.ref.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            opencode-src-web-${{ steps.ref.outputs.ref }}-

      - name: Clone upstream opencode (v2 / beta)
        id: clone
        run: |
          set -euo pipefail
          REF="${{ steps.ref.outputs.ref }}"
          if [ -d build/opencode-src/.git ]; then
            echo "upstream checkout exists, refreshing"
            git -C build/opencode-src fetch --depth 1 origin "$REF" || true
            git -C build/opencode-src checkout --force FETCH_HEAD || true
          else
            mkdir -p build
            git clone --depth 1 --branch "$REF" \
              https://github.com/anomalyco/opencode.git build/opencode-src
          fi
          SHA="$(git -C build/opencode-src rev-parse HEAD 2>/dev/null || true)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          test -n "$SHA" || { echo "::error::empty upstream SHA"; exit 1; }

      - name: Cache bun install
        id: cache-install
        uses: actions/cache@v5
        with:
          path: build/opencode-src/node_modules
          key: v2-web-install-${{ runner.os }}-${{ hashFiles('build/opencode-src/bun.lock') }}

      - name: Install dependencies
        if: steps.cache-install.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd build/opencode-src
          bun install --os="*" --cpu="*"

      - name: Cache web assets
        id: cache-web
        uses: actions/cache@v5
        with:
          path: build/web-assets
          key: v2-web-assets-${{ runner.os }}-${{ inputs.skip_web_ui }}-${{ steps.clone.outputs.sha }}

      - name: Build web assets
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cp scripts/build-web-assets.ts build/opencode-src/packages/cli/script/build-web-assets.ts
          export OPENCODE_PKG_DIR="$GITHUB_WORKSPACE/build/opencode-src/packages/cli"
          export OPENCODE_WEB_ASSETS_OUT="$GITHUB_WORKSPACE/build/web-assets/web-assets.b64"
          cd build/opencode-src/packages/cli
          bun run script/build-web-assets.ts ${{ inputs.skip_web_ui && '--skip-web-ui' || '' }}

      - name: Upload web assets
        uses: actions/upload-artifact@v5
        with:
          name: opencode-web-assets
          path: build/web-assets/web-assets.b64
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 3: opencode2 binary
  #
  # The Bun bundle. Memory is the constraint here (bytecode + minify + splitting
  # over a large monorepo), so it gets its own runner and never shares one with
  # the Zig/NDK native build.
  # ---------------------------------------------------------------------------
  build-opencode2:
    needs: [build-libopentui, build-web-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve upstream ref
        id: ref
        run: echo "ref=${{ inputs.upstream_ref }}" >> "$GITHUB_OUTPUT"

      - name: Cache upstream source
        id: cache-upstream
        uses: actions/cache@v5
        with:
          path: build/opencode-src
          # Bumped per run so a re-dispatch picks up new upstream commits, while
          # restore-keys lets a same-ref rerun reuse the previous checkout.
          key: opencode-src-${{ steps.ref.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            opencode-src-${{ steps.ref.outputs.ref }}-

      - name: Clone upstream opencode (v2 / beta)
        run: |
          set -euo pipefail
          REF="${{ steps.ref.outputs.ref }}"
          if [ -d build/opencode-src/.git ]; then
            echo "upstream checkout exists, refreshing"
            git -C build/opencode-src fetch --depth 1 origin "$REF" || true
            git -C build/opencode-src checkout --force FETCH_HEAD || true
          else
            mkdir -p build
            git clone --depth 1 --branch "$REF" \
              https://github.com/anomalyco/opencode.git build/opencode-src
          fi
          SHA="$(git -C build/opencode-src rev-parse HEAD)"
          echo "$SHA" > build/opencode-src/.built-sha
          echo "::notice::upstream HEAD: $SHA"

      - name: Cache bun install
        id: cache-install
        uses: actions/cache@v5
        with:
          path: build/opencode-src/node_modules
          key: v2-bun-install-${{ runner.os }}-${{ hashFiles('build/opencode-src/bun.lock') }}

      - name: Download libopentui.so
        uses: actions/download-artifact@v5
        with:
          name: libopentui-android
          path: build/otui-assets

      - name: Download web app assets
        uses: actions/download-artifact@v5
        with:
          name: opencode-web-assets
          path: build/web-assets

      - name: Install dependencies
        if: steps.cache-install.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd build/opencode-src
          bun install --os="*" --cpu="*"

      - name: Build opencode2 for android
        env:
          # Bound Bun's heap so a spike fails loudly instead of the runner OOM
          # killer taking the job down with no log. JSC option, value in bytes
          # (heapSize is not a valid name; bun 1.4.1 rejects it at startup).
          BUN_JSC_gcMaxHeapSize: "3221225472"
        run: |
          set -euo pipefail
          # Make @opencode-ai/script and ./app-assets resolvable: both resolve
          # relative to the script's own location, so the script must live
          # inside the upstream checkout (packages/cli/script/).
          cp scripts/build-opencode2.ts build/opencode-src/packages/cli/script/build-opencode2.ts
          export OPENCODE_PKG_DIR="$GITHUB_WORKSPACE/build/opencode-src/packages/cli"
          # Reuse the archive from the build-web-assets job (empty when
          # skip_web_ui=true); never re-run Vite here.
          export OPENCODE_APP_ASSETS="$GITHUB_WORKSPACE/build/web-assets/web-assets.b64"
          cd build/opencode-src/packages/cli
          bun run script/build-opencode2.ts

      - name: Stash upstream SHA in the bundle
        # Stage 4 has no access to the checkout and uses this to name the archive.
        run: |
          set -euo pipefail
          cp build/opencode-src/.built-sha \
            build/opencode-src/packages/cli/dist/opencode2-linux-aarch64-android/bin/.built-sha

      - name: Verify binary
        run: |
          set -euo pipefail
          BIN="build/opencode-src/packages/cli/dist/opencode2-linux-aarch64-android/bin/opencode2"
          test -f "$BIN" || {
            echo "::error::binary missing at $BIN"
            ls -R build/opencode-src/packages/cli/dist || true
            exit 1
          }
          file "$BIN"
          # aarch64 cannot execute here, so assert the ELF target instead.
          readelf -h "$BIN" | grep -q "AArch64" \
            || { echo "::error::binary is not AArch64"; exit 1; }
          echo "::notice::opencode2 OK ($(du -h "$BIN" | cut -f1))"

      - name: Upload opencode2
        uses: actions/upload-artifact@v5
        with:
          name: opencode2-android
          # Upload the `bin/` directory itself so downloading to `package/bin`
          # lands opencode2 and .built-sha straight at that path (uploading
          # the parent dist dir would nest them one level deeper).
          path: build/opencode-src/packages/cli/dist/opencode2-linux-aarch64-android/bin
          # .built-sha starts with a dot; upload-artifact skips hidden files
          # unless explicitly included.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 5: v2 plugin verification on a native Linux binary
  #
  # Before migrating the v1 plugins (tests/v2-plugin/hello) to the v2 API we must
  # prove the v2 plugin machinery works end to end on a real binary. This job is
  # independent of the Android pipeline: it builds the upstream v2 CLI for
  # linux-x64 (no android patches involved) and runs it, then asserts a directory
  # plugin gets its setup() called (sentinel files) and shows up active in
  # /api/plugin. Native re-compilation is ~2-4 min; the cheap thing to miss is a
  # broken plugin load, so skipping the android parts is fine.
  # ---------------------------------------------------------------------------
  verify-v2-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve upstream ref
        id: ref
        run: echo "ref=${{ inputs.upstream_ref }}" >> "$GITHUB_OUTPUT"

      - name: Cache upstream source
        id: cache-upstream
        uses: actions/cache@v5
        with:
          path: build/opencode-src
          key: opencode-src-verify-${{ steps.ref.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            opencode-src-verify-${{ steps.ref.outputs.ref }}-

      - name: Clone upstream opencode (v2 / beta)
        run: |
          set -euo pipefail
          REF="${{ steps.ref.outputs.ref }}"
          if [ -d build/opencode-src/.git ]; then
            echo "upstream checkout exists, refreshing"
            git -C build/opencode-src fetch --depth 1 origin "$REF" || true
            git -C build/opencode-src checkout --force FETCH_HEAD || true
          else
            mkdir -p build
            git clone --depth 1 --branch "$REF" \
              https://github.com/anomalyco/opencode.git build/opencode-src
          fi
          SHA="$(git -C build/opencode-src rev-parse HEAD)"
          echo "::notice::upstream HEAD: $SHA"

      - name: Cache bun install
        id: cache-install
        uses: actions/cache@v5
        with:
          path: build/opencode-src/node_modules
          key: v2-verify-install-${{ runner.os }}-${{ hashFiles('build/opencode-src/bun.lock') }}

      - name: Install dependencies
        if: steps.cache-install.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd build/opencode-src
          bun install --os="*" --cpu="*"

      - name: Build native linux-x64 opencode2
        run: |
          set -euo pipefail
          cd build/opencode-src/packages/cli
          bun run script/build.ts \
            --target=opencode2-linux-x64 \
            --skip-web-ui \
            --skip-install

      - name: Run v2 plugin verification
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/build/opencode-src/packages/cli/dist/cli-linux-x64/bin/opencode2"
          test -x "$BIN" || { echo "::error::linux binary missing: $BIN"; ls -R "$GITHUB_WORKSPACE/build/opencode-src/packages/cli/dist" || true; exit 1; }
          chmod +x tests/v2-plugin/verify.sh
          ./tests/v2-plugin/verify.sh "$BIN"

  # ---------------------------------------------------------------------------
  # Stage 4: bundle
  #
  # Assembles the shippable set: binary + native runtime assets + compat libs.
  # Cheap - it only archives what the other jobs produced.
  # ---------------------------------------------------------------------------
  package:
    needs: [build-libopentui, build-compat-libs, build-opencode2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download opencode2
        uses: actions/download-artifact@v5
        with:
          name: opencode2-android
          path: package/bin

      - name: Download libopentui.so
        uses: actions/download-artifact@v5
        with:
          name: libopentui-android
          path: package/otui-assets

      - name: Download compat libraries
        uses: actions/download-artifact@v5
        with:
          name: compat-libs-android
          path: package/lib

      - name: Copy libc++_shared.so from the NDK
        # Bun's JIT modules need libc++_shared.so and Android's /system does not
        # provide it, so ship the NDK copy.
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL --max-time 900 -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
          unzip -q -o ndk.zip "android-ndk-${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          cp "android-ndk-${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            "$GITHUB_WORKSPACE/package/lib/"
          rm -rf ndk.zip "android-ndk-${ANDROID_NDK_VERSION}"

      - name: Copy launcher
        run: |
          set -euo pipefail
          cp termux/start-opencode2.sh package/
          chmod +x package/start-opencode2.sh package/bin/opencode2
          find package -type f | sort

      - name: Record upstream SHA
        id: sha
        run: |
          set -euo pipefail
          # build/opencode-src is not present in this job (stage 3 owned it), so
          # read the SHA that stage 3 stashed into the bundle.
          SHA="$(cat package/bin/.built-sha 2>/dev/null || echo unknown)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::upstream SHA: $SHA"

      - name: Create archive
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' '${{ steps.sha.outputs.sha }}' | cut -c1-8)"
          NAME="opencode2-android-aarch64-${SHORT}"
          mkdir -p /tmp/pkg
          cp -a package "/tmp/pkg/$NAME"
          tar -czf "/tmp/$NAME.tar.gz" -C /tmp/pkg "$NAME"
          ls -la "/tmp/$NAME.tar.gz"

      - name: Upload release bundle
        uses: actions/upload-artifact@v5
        with:
          name: opencode2-android-bundle
          path: /tmp/opencode2-android-aarch64-*.tar.gz
          if-no-files-found: error
          retention-days: 30
